<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-labelledby="title desc"><title id="title">PulseFeed request lifecycle</title><desc id="desc">The browser waits for RSS validation and atomic admission before navigation. The app persists intent before each separate Qwen and FLUX submission; unknown outcomes hold reservations without automatic replay.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25283D"/></marker></defs><rect width="1600" height="1210" fill="#FAF9F6"/><rect x="50" y="38" width="12" height="12" rx="3" fill="#DED8F8" stroke="none" stroke-width="2"/><rect x="65" y="38" width="12" height="12" rx="3" fill="#CEF0DE" stroke="none" stroke-width="2"/><rect x="50" y="53" width="12" height="12" rx="3" fill="#FFDCC7" stroke="none" stroke-width="2"/><text x="92" y="55.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#606579" text-anchor="start">PULSEFEED · TECHNICAL REFERENCE</text><text x="50" y="105.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#25283D" text-anchor="start">From “View RSS” to a saved browser image</text><text x="50" y="140.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#606579" text-anchor="start">A fresh request admits work once; read-only page and image retrieval never start model jobs</text><rect x="90" y="172" width="220" height="48" rx="3" fill="#DED8F8" stroke="#25283D" stroke-width="2"/><text x="200" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#25283D" text-anchor="middle">Browser</text><polyline points="200,220 200,985" fill="none" stroke="#B8B8C5" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="455" y="172" width="220" height="48" rx="3" fill="#DED8F8" stroke="#25283D" stroke-width="2"/><text x="565" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#25283D" text-anchor="middle">App / coordinator</text><polyline points="565,220 565,985" fill="none" stroke="#B8B8C5" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="790" y="172" width="220" height="48" rx="3" fill="#CEF0DE" stroke="#25283D" stroke-width="2"/><text x="900" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#25283D" text-anchor="middle">SQLite</text><polyline points="900,220 900,985" fill="none" stroke="#B8B8C5" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="1085" y="172" width="220" height="48" rx="3" fill="#FFDCC7" stroke="#25283D" stroke-width="2"/><text x="1195" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#25283D" text-anchor="middle">Qwen worker</text><polyline points="1195,220 1195,985" fill="none" stroke="#B8B8C5" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="1320" y="172" width="220" height="48" rx="3" fill="#FFDCC7" stroke="#25283D" stroke-width="2"/><text x="1430" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#25283D" text-anchor="middle">FLUX worker</text><polyline points="1430,220 1430,985" fill="none" stroke="#B8B8C5" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 6"/><rect x="35.0" y="231" width="330" height="42" rx="3" fill="#FAF9F6" stroke="#B8B8C5" stroke-width="2"/><text x="200" y="258.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="550" fill="#25283D" text-anchor="middle">Persist request key in sessionStorage</text><text x="382.5" y="299.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">POST URL + key · cookie + CSRF</text><polyline points="200,309 565,309" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="732.5" y="346.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Check owner + exact-key replay</text><polyline points="565,356 900,356" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="410.0" y="385" width="310" height="42" rx="3" fill="#FFDCC7" stroke="#B8B8C5" stroke-width="2"/><text x="565" y="412.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="550" fill="#25283D" text-anchor="middle">Fresh key: validate + fetch RSS</text><text x="732.5" y="449.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Snapshot + quotas + reservations</text><polyline points="565,459 900,459" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="382.5" y="502.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Validated view · immutable 1-hour expiry</text><polyline points="565,512 200,512" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="45.0" y="534" width="310" height="42" rx="3" fill="#CEF0DE" stroke="#B8B8C5" stroke-width="2"/><text x="200" y="561.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="550" fill="#25283D" text-anchor="middle">Save response, then navigate</text><text x="732.5" y="589.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Persist Qwen intent / submitting</text><polyline points="565,599 900,599" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="880.0" y="634.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Submit /run · persist ID · poll /status/{id}</text><polyline points="565,644 1195,644" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="880.0" y="679.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Verified prompt + measured usage</text><polyline points="1195,689 565,689" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="732.5" y="724.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Save final prompt + persist FLUX intent</text><polyline points="565,734 900,734" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="997.5" y="769.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Submit /run · persist ID · poll /status/{id}</text><polyline points="565,779 1430,779" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="997.5" y="814.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Image + measured usage</text><polyline points="1430,824 565,824" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="732.5" y="859.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Verify, settle, save metadata only</text><polyline points="565,869 900,869" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="382.5" y="904.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Poll owned batch; request existing image</text><polyline points="200,914 565,914" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="382.5" y="948.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25283D" text-anchor="middle">Validated bytes → decode → IndexedDB Blob</text><polyline points="565,958 200,958" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="54" y="1024" width="470" height="135" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="50" y="1020" width="470" height="135" rx="3" fill="#CEF0DE" stroke="#25283D" stroke-width="2"/><text x="70" y="1053.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Exact replay / reload</text><text x="70" y="1085" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Same key: original selection + expiry</text><text x="70" y="1112" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">No new generation; uncertain POST</text><text x="70" y="1139" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">requires an explicit same-key retry</text><rect x="554" y="1024" width="500" height="135" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="550" y="1020" width="500" height="135" rx="3" fill="#FFDCC7" stroke="#25283D" stroke-width="2"/><text x="570" y="1053.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Unknown provider outcome</text><text x="570" y="1085" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Hold reservations; freeze new dispatch</text><text x="570" y="1112" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Keep polling known job IDs when possible</text><text x="570" y="1139" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Operator reconciliation; no automatic replay</text><rect x="1084" y="1024" width="470" height="135" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="1080" y="1020" width="470" height="135" rx="3" fill="#DED8F8" stroke="#25283D" stroke-width="2"/><text x="1100" y="1053.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Finite image lifetime</text><text x="1100" y="1085" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Browser Blob: original one-hour expiry</text><text x="1100" y="1112" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Provider result: temporary retrieval</text><text x="1100" y="1139" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">SQLite: metadata, never image bytes</text><text x="50" y="1186.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#606579" text-anchor="start">RSS rejection precedes navigation and inference. Qwen → app → FLUX; no direct model-to-model call. | Status: 20 Oct 2026</text></svg>