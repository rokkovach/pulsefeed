<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">PulseFeed architecture and trust boundaries</title><desc id="desc">A single FastAPI app orchestrates two separate Runpod queue workers. Browser-local images expire with the one-hour view; SQLite stores metadata, not an image archive.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#25283D"/></marker></defs><rect width="1600" height="1000" fill="#FAF9F6"/><rect x="50" y="38" width="12" height="12" rx="3" fill="#DED8F8" stroke="none" stroke-width="2"/><rect x="65" y="38" width="12" height="12" rx="3" fill="#CEF0DE" stroke="none" stroke-width="2"/><rect x="50" y="53" width="12" height="12" rx="3" fill="#FFDCC7" stroke="none" stroke-width="2"/><text x="92" y="55.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#606579" text-anchor="start">PULSEFEED · TECHNICAL REFERENCE</text><text x="50" y="105.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#25283D" text-anchor="start">One app orchestrates two independent workers</text><text x="50" y="140.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#606579" text-anchor="start">Runpod pipeline verified from the laptop · Railway app update and connected smoke test pending</text><rect x="50" y="175" width="330" height="540" rx="3" fill="#FAF9F6" stroke="#B8B8C5" stroke-width="2" stroke-dasharray="8 7"/><text x="70" y="210.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#25283D" text-anchor="start">VISITOR BROWSER</text><rect x="420" y="175" width="650" height="540" rx="3" fill="#FAF9F6" stroke="#B8B8C5" stroke-width="2" stroke-dasharray="8 7"/><text x="440" y="210.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#25283D" text-anchor="start">RAILWAY · WEB APP</text><rect x="1110" y="175" width="440" height="540" rx="3" fill="#FAF9F6" stroke="#B8B8C5" stroke-width="2" stroke-dasharray="8 7"/><text x="1130" y="210.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#25283D" text-anchor="start">RUNPOD · LIVE ENDPOINTS</text><rect x="79" y="249" width="280" height="110" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="75" y="245" width="280" height="110" rx="3" fill="#DED8F8" stroke="#25283D" stroke-width="2"/><text x="95" y="278.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Reader UI</text><text x="95" y="310" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">HTML + local JavaScript</text><text x="95" y="337" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Owner-scoped requests</text><rect x="79" y="409" width="280" height="115" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="75" y="405" width="280" height="115" rx="3" fill="#FAF9F6" stroke="#25283D" stroke-width="2"/><text x="95" y="438.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">sessionStorage</text><text x="95" y="470" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Submission key + recovery</text><text x="95" y="497" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">10-minute recovery record</text><rect x="79" y="559" width="280" height="135" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="75" y="555" width="280" height="135" rx="3" fill="#CEF0DE" stroke="#25283D" stroke-width="2"/><text x="95" y="588.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">IndexedDB</text><text x="95" y="620" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Validated image Blobs</text><text x="95" y="647" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Purge at original view expiry</text><text x="95" y="674" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">One-hour reader lifetime</text><polyline points="215,355 215,405" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="355,320 390,320 390,615 355,615" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="459" y="249" width="275" height="125" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="455" y="245" width="275" height="125" rx="3" fill="#DED8F8" stroke="#25283D" stroke-width="2"/><text x="475" y="278.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Routes + authorization</text><text x="475" y="310" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Cookie, CSRF, ownership</text><text x="475" y="337" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Response / image checks</text><rect x="769" y="249" width="270" height="125" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="765" y="245" width="270" height="125" rx="3" fill="#CEF0DE" stroke="#25283D" stroke-width="2"/><text x="785" y="278.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Admission + policy</text><text x="785" y="310" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Bounded source snapshot</text><text x="785" y="337" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Atomic limits + reservations</text><rect x="459" y="469" width="275" height="190" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="455" y="465" width="275" height="190" rx="3" fill="#CEF0DE" stroke="#25283D" stroke-width="2"/><text x="475" y="498.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Persistent SQLite</text><text x="475" y="530" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Sessions, policy, snapshots</text><text x="475" y="557" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Runs, invocations, usage</text><text x="475" y="584" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Reservations + audit history</text><text x="475" y="611" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Output metadata only</text><rect x="769" y="469" width="270" height="190" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="765" y="465" width="270" height="190" rx="3" fill="#DED8F8" stroke="#25283D" stroke-width="2"/><text x="785" y="498.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">One coordinator</text><text x="785" y="530" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Persist intent before submit</text><text x="785" y="557" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Save IDs; poll existing jobs</text><text x="785" y="584" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Compose + filter prompt</text><text x="785" y="611" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">One ASGI process / replica</text><polyline points="355,285 455,285" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="405" y="269.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#25283D" text-anchor="middle">HTTPS</text><polyline points="73