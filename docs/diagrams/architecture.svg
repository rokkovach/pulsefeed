 x="1144" y="479" width="380" height="130" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="1140" y="475" width="380" height="130" rx="3" fill="#FFDCC7" stroke="#25283D" stroke-width="2"/><text x="1160" y="508.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">FLUX.2-klein-4B · BF16</text><text x="1160" y="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">512 × 512 image + usage</text><text x="1160" y="567" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Separate queue endpoint</text><text x="1160" y="594" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">App slots: 1–3 · GPU / worker: 1</text><polyline points="1035,505 1087,505 1087,330 1140,330" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="1035,575 1140,575" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1138" y="649" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">/run → save ID → /status/{id}</text><text x="1138" y="677" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Server-held credentials; fixed jobs</text><rect x="459" y="779" width="580" height="120" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="455" y="775" width="580" height="120" rx="3" fill="#FFDCC7" stroke="#25283D" stroke-width="2"/><text x="475" y="808.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Untrusted public RSS / Atom</text><text x="475" y="840" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Public DNS pinned to socket; redirects revalidated</text><text x="475" y="867" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Safe XML · 2 MiB cap · bounded 10-second fetch</text><polyline points="455,340 438,340 438,835 455,835" fill="none" stroke="#25283D" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="54" y="779" width="330" height="120" rx="3" fill="#EAE7E1" stroke="none" stroke-width="2"/><rect x="50" y="775" width="330" height="120" rx="3" fill="#DED8F8" stroke="#25283D" stroke-width="2"/><text x="70" y="808.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Protected admin</text><text x="70" y="840" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Aggregate usage + policy</text><text x="70" y="867" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Visitor feeds stay owner-scoped</text><text x="1110" y="780.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" fill="#25283D" text-anchor="start">Temporary provider output</text><text x="1110" y="816" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Runpod: 30 min after completion</text><text x="1110" y="845" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">Weight cache stores models only</text><text x="1110" y="874" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#606579" text-anchor="start">No permanent image archive</text><text x="50" y="943.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#25283D" text-anchor="start">Trust boundaries are dashed. Every model exchange passes through the app; workers never call each other.</text><text x="50" y="976.0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#606579" text-anchor="start">Evidence: docs/architecture.md · docs/deployment.md · docs/dependency-remediation-2026-10-20.md | Status: 20 Oct 2026</text></svg>