<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60705c"/></marker></defs><rect width="1400" height="720" fill="#fafbf8"/><rect x="35" y="200" width="285" height="175" rx="8" fill="#e6eddc" stroke="#a9b5a3" stroke-width="2"/><text x="58" y="238" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18261b">Visitor browser</text><text x="58" y="276" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Reader and admin UI</text><text x="58" y="306" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">IndexedDB image Blobs</text><text x="58" y="336" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Fixed one-hour expiry</text><rect x="415" y="160" width="465" height="245" rx="8" fill="#e3e3f1" stroke="#a9b5a3" stroke-width="2"/><text x="438" y="198" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18261b">FastAPI on Railway</text><text x="438" y="236" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Routes, sessions and RSS validation</text><text x="438" y="266" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">One coordinator and SQLite on /data</text><text x="438" y="296" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Admission, job state and usage</text><text x="438" y="326" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Server-held Runpod credentials</text><rect x="1010" y="50" width="355" height="185" rx="8" fill="#e3e3f1" stroke="#a9b5a3" stroke-width="2"/><text x="1033" y="88" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18261b">Qwen queue endpoint</text><text x="1033" y="126" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Article context to visual prompt</text><text x="1033" y="156" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">NVFP4 on one GPU per worker</text><text x="1033" y="186" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Input and output token usage</text><rect x="1010" y="350" width="355" height="185" rx="8" fill="#f5e6d8" stroke="#a9b5a3" stroke-width="2"/><text x="1033" y="388" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18261b">FLUX queue endpoint</text><text x="1033" y="426" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Prompt to 512-square image</text><text x="1033" y="456" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">BF16 on one GPU per worker</text><text x="1033" y="486" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Measured images and attempts</text><polyline points="320,285 415,285" fill="none" stroke="#60705c" stroke-width="3" marker-end="url(#a)"/><text x="330" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#18261b">HTTPS</text><polyline points="880,225 945,225 945,140 1010,140" fill="none" stroke="#60705c" stroke-width="3" marker-end="url(#a)"/><polyline points="1010,190 970,190 970,285 880,285" fill="none" stroke="#60705c" stroke-width="3" marker-end="url(#a)"/><polyline points="880,335 945,335 945,430 1010,430" fill="none" stroke="#60705c" stroke-width="3" marker-end="url(#a)"/><polyline points="1010,480 920,480 920,375 880,375" fill="none" stroke="#60705c" stroke-width="3" marker-end="url(#a)"/><text x="920" y="20" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18261b">Separate model images and locks</text><rect x="415" y="470" width="465" height="125" rx="8" fill="#e6eddc" stroke="#a9b5a3" stroke-width="2"/><text x="438" y="508" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18261b">Public RSS and Atom</text><text x="438" y="546" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Safe destination checks and bounded fetch</text><text x="438" y="576" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Feed text is untrusted model context</text><polyline points="645,405 645,470" fill="none" stroke="#60705c" stroke-width="3" marker-end="url(#a)"/><text x="35" y="655" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18261b">The app coordinates both stages. Workers never call each other.</text><text x="35" y="690" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#18261b">Verified local app to Runpod. Latest connected Railway release pending redeployment.</text></svg>