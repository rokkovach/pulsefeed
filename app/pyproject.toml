[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsefeed"
version = "0.1.0"
requires-python = ">=3.11"
# Pin Starlette explicitly: public StaticFiles needs the patched Range parser.
# Forms use bounded manual parsing; installing python-multipart is unnecessary.
dependencies = ["fastapi==0.135.4", "starlette==1.3.1", "uvicorn==0.37.0", "httpx==0.28.1", "jinja2==3.1.6", "defusedxml==0.7.1", "Pillow==13.0.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
include = ["pulsefeed*"]

[tool.setuptools.package-data]
pulsefeed = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
